<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- halftone dot pattern, same trick as the Hero's rocket glow -->
    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#ffffff" />
    </pattern>
    <radialGradient id="haloFade" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="haloMask">
      <rect x="0" y="0" width="900" height="620" fill="url(#haloFade)"/>
    </mask>

    <!-- lobe silhouettes, reused as clip paths for the flat shadow blobs -->
    <clipPath id="leftLobeClip">
      <path d="M 172,100 L 320,100 C 341,100 353,118 353,140
               C 353,192 350,232 354,300 C 358,378 330,452 262,498
               C 214,530 150,528 112,494 C 68,454 55,392 57,320
               C 59,250 55,190 76,150 C 92,120 138,100 172,100 Z"/>
    </clipPath>
    <clipPath id="rightLobeClip">
      <path d="M 728,100 L 580,100 C 559,100 547,118 547,140
               C 547,192 550,232 546,300 C 542,378 570,452 638,498
               C 686,530 750,528 788,494 C 832,454 845,392 843,320
               C 841,250 845,190 824,150 C 808,120 762,100 728,100 Z"/>
    </clipPath>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect x="0" y="0" width="900" height="620" fill="#0b0b10"/>
  <g opacity="0.08" mask="url(#haloMask)">
    <rect x="0" y="0" width="900" height="620" fill="url(#halftone)"/>
  </g>

  <!-- scattered comic stars, same shape/style as Hero's SmallStar -->
  <g stroke="#0b0b10" stroke-width="2" stroke-linejoin="round">
    <path d="M100 60 L106 82 L128 88 L106 94 L100 116 L94 94 L72 88 L94 82 Z" fill="#FFD23F"/>
    <path d="M812 100 L817 116 L833 121 L817 126 L812 142 L807 126 L791 121 L807 116 Z" fill="#FF3D8A"/>
    <path d="M60 420 L64 432 L76 436 L64 440 L60 452 L56 440 L44 436 L56 432 Z" fill="#2E6FF2"/>
    <path d="M840 440 L844 452 L856 456 L844 460 L840 472 L836 460 L824 456 L836 452 Z" fill="#38D66B"/>
  </g>

  <!-- ===================== BODY ===================== -->
  <!-- Left lobe -->
  <path d="M 172,100 L 320,100 C 341,100 353,118 353,140
           C 353,192 350,232 354,300 C 358,378 330,452 262,498
           C 214,530 150,528 112,494 C 68,454 55,392 57,320
           C 59,250 55,190 76,150 C 92,120 138,100 172,100 Z"
        fill="#2E6FF2" stroke="#0b0b10" stroke-width="14" stroke-linejoin="round"/>

  <!-- Right lobe (mirror) -->
  <path d="M 728,100 L 580,100 C 559,100 547,118 547,140
           C 547,192 550,232 546,300 C 542,378 570,452 638,498
           C 686,530 750,528 788,494 C 832,454 845,392 843,320
           C 841,250 845,190 824,150 C 808,120 762,100 728,100 Z"
        fill="#2E6FF2" stroke="#0b0b10" stroke-width="14" stroke-linejoin="round"/>

  <!-- flat dark-navy shadow blobs, clipped to each lobe (Earth/RingedPlanet shading trick) -->
  <g clip-path="url(#leftLobeClip)">
    <path d="M 40,300 C 120,290 190,330 210,410 C 220,460 195,510 140,525
             C 80,540 30,500 20,430 C 12,370 10,320 40,300 Z" fill="#123166"/>
  </g>
  <g clip-path="url(#rightLobeClip)">
    <path d="M 860,300 C 780,290 710,330 690,410 C 680,460 705,510 760,525
             C 820,540 870,500 880,430 C 888,370 890,320 860,300 Z" fill="#123166"/>
  </g>

  <!-- flat white ink highlight streaks, comic-style -->
  <path d="M 150,340 C 158,390 178,430 210,455" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  <path d="M 190,370 C 196,405 210,435 230,455" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.4"/>
  <path d="M 750,340 C 742,390 722,430 690,455" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  <path d="M 710,370 C 704,405 690,435 670,455" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.4"/>

  <!-- center neck connecting to thumbstick housing -->
  <path d="M 320,100 L 580,100 C 576,140 534,168 538,210
           C 542,252 574,270 574,320 C 574,370 518,398 450,398
           C 382,398 326,370 326,320 C 326,270 358,252 362,210
           C 366,168 324,140 320,100 Z"
        fill="#2E6FF2" stroke="#0b0b10" stroke-width="14" stroke-linejoin="round"/>
  <g clip-path="url(#leftLobeClip)"></g>
  <path d="M 450,398 C 518,398 574,370 574,320 C 574,290 556,270 546,250
           L 354,250 C 344,270 326,290 326,320 C 326,370 382,398 450,398 Z"
        fill="#123166" opacity="0.9"/>

  <!-- ===================== SCREEN MODULE (widened) ===================== -->
  <!-- mounting bracket bolts -->
  <circle cx="320" cy="100" r="9" fill="#123166" stroke="#0b0b10" stroke-width="4"/>
  <circle cx="580" cy="100" r="9" fill="#123166" stroke="#0b0b10" stroke-width="4"/>

  <!-- top accent bar -->
  <rect x="265" y="86" width="370" height="16" rx="8" fill="#38D66B" stroke="#0b0b10" stroke-width="6"/>

  <!-- screen (wider) -->
  <rect x="235" y="108" width="430" height="150" rx="14" fill="#0b0b10" stroke="#FFD23F" stroke-width="10" stroke-linejoin="round"/>
  <rect x="251" y="124" width="398" height="118" rx="6" fill="#0f1a33"/>
  <text x="450" y="180" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="48" letter-spacing="1"
        fill="#FFD23F" stroke="#0b0b10" stroke-width="2.5" paint-order="stroke">ORBITAL</text>
  <text x="450" y="228" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="48" letter-spacing="2"
        fill="#FF3D8A" stroke="#0b0b10" stroke-width="2.5" paint-order="stroke">GAMES</text>

  <!-- speaker dots -->
  <g fill="#123166">
    <circle cx="410" cy="250" r="5"/>
    <circle cx="428" cy="250" r="5"/>
    <circle cx="446" cy="250" r="5"/>
    <circle cx="464" cy="250" r="5"/>
    <circle cx="482" cy="250" r="5"/>
  </g>

  <!-- ===================== D-PAD (pushed further out) ===================== -->
  <g transform="translate(-150,0)">
    <path d="M 264,166 h22 v-22 h28 v22 h22 v28 h-22 v22 h-28 v-22 h-22 Z"
          fill="#FFD23F" stroke="#0b0b10" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- small pink accent dot, shifted with the d-pad -->
  <circle cx="158" cy="300" r="11" fill="#FF3D8A" stroke="#0b0b10" stroke-width="5"/>

  <!-- ===================== THUMBSTICKS ===================== -->
  <circle cx="410" cy="310" r="46" fill="#123166" stroke="#0b0b10" stroke-width="10"/>
  <circle cx="410" cy="310" r="30" fill="#2E6FF2" stroke="#0b0b10" stroke-width="8"/>
  <circle cx="400" cy="300" r="8" fill="#ffffff" opacity="0.5"/>

  <circle cx="490" cy="310" r="46" fill="#123166" stroke="#0b0b10" stroke-width="10"/>
  <circle cx="490" cy="310" r="30" fill="#FF3D8A" stroke="#0b0b10" stroke-width="8"/>
  <circle cx="480" cy="300" r="8" fill="#ffffff" opacity="0.5"/>

  <!-- ===================== ABXY (pushed further out) ===================== -->
  <g transform="translate(150,0)">
    <circle cx="592" cy="160" r="19" fill="#FFD23F" stroke="#0b0b10" stroke-width="7"/>
    <text x="592" y="167" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="#0b0b10">Y</text>

    <circle cx="622" cy="190" r="19" fill="#FF3D8A" stroke="#0b0b10" stroke-width="7"/>
    <text x="622" y="197" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="#0b0b10">B</text>

    <circle cx="592" cy="220" r="19" fill="#38D66B" stroke="#0b0b10" stroke-width="7"/>
    <text x="592" y="227" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="#0b0b10">A</text>

    <circle cx="562" cy="190" r="19" fill="#2E6FF2" stroke="#0b0b10" stroke-width="7"/>
    <text x="562" y="197" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff">X</text>
  </g>
</svg>
